services:
  caddy:
    image: caddy:2
    environment:
      SYNC_DOMAIN: "${SYNC_DOMAIN:?请设置 SYNC_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      tide-sync:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
