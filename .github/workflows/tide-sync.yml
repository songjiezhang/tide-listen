name: TideListen Sync

on:
  push:
    paths:
      - 'sync-server/**'
      - '.github/workflows/tide-sync.yml'
  pull_request:
    paths:
      - 'sync-server/**'
      - '.github/workflows/tide-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    defaults:
      run:
        working-directory: sync-server
    env:
      SYNC_DOMAIN: sync.example.com
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - run: docker compose build
      - run: printf '%s\n' 'ci-fixture-admin-2026' | docker compose run --rm -T sync init admin
      - run: docker compose up -d --wait
      - run: |
          curl --fail --silent http://127.0.0.1:8472/health
          curl --fail --silent http://127.0.0.1:8472/admin | grep -q '同步管理'
          docker compose exec -T sync node /app/server.mjs backup /data/ci.sqlite
          docker compose cp sync:/data/ci.sqlite /tmp/tide-sync-ci.sqlite
          test -s /tmp/tide-sync-ci.sqlite
      - run: docker run --rm --volume "${PWD}:/suite:ro" --entrypoint node "$(docker compose images -q sync)" /suite/test.mjs
      - name: Save verified image
        env:
          TIDE_ARCH: ${{ matrix.arch }}
        run: |
          docker save tidelisten-sync:local | gzip -1 > "/tmp/TideListen-Sync-linux-$TIDE_ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: sync-linux-${{ matrix.arch }}
          path: /tmp/TideListen-Sync-linux-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 7
      - if: always()
        run: docker compose down -v

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build both Android release variants
        working-directory: packages/android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          bash gradlew --no-daemon assemblePhoneRelease assembleDashboardRelease
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash sync-server/tests/android/run.sh
