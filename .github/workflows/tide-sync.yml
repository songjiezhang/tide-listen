name: TideListen Sync

on:
  push:
    paths:
      - 'sync-server/**'
      - '.github/workflows/tide-sync.yml'
  pull_request:
    paths:
      - 'sync-server/**'
      - '.github/workflows/tide-sync.yml'
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the verified sync server to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    defaults:
      run:
        working-directory: sync-server
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
      SYNC_DOMAIN: sync.example.com
      SYNC_ADMIN_USERNAME: compose-admin
      SYNC_ADMIN_PASSWORD: compose-qa-password-2026
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - run: docker compose build
      - run: docker compose up -d --no-build --wait
      - name: Verify first startup and persisted admin
        run: |
          curl --fail --silent http://127.0.0.1:8472/health
          curl --fail --silent http://127.0.0.1:8472/admin | grep -q '同步服务'
          curl --fail --silent http://127.0.0.1:8472/favicon.png | cmp favicon.png -
          login() {
            curl -sS http://127.0.0.1:8472/admin/api/login \
              -H 'Origin: https://sync.example.com' -H 'Content-Type: application/json' \
              --data '{"name":"compose-admin","password":"compose-qa-password-2026"}'
          }
          login | jq -e '.account == "compose-admin"'
          SYNC_ADMIN_USERNAME=replacement SYNC_ADMIN_PASSWORD=replacement-qa-password \
            docker compose up -d --no-build --wait
          login | jq -e '.account == "compose-admin"'
          result="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8472/admin/api/login \
            -H 'Origin: https://sync.example.com' -H 'Content-Type: application/json' \
            --data '{"name":"replacement","password":"replacement-qa-password"}')"
          test "$result" = 401
          SYNC_ADMIN_PASSWORD= docker compose up -d --no-build --wait
          login | jq -e '.account == "compose-admin"'
          docker compose exec -T --user node sync node /app/server.mjs backup /data/ci.sqlite
          docker compose cp sync:/data/ci.sqlite /tmp/tide-sync-ci.sqlite
          test -s /tmp/tide-sync-ci.sqlite
      - name: Verify standalone docker run
        run: |
          file="$RUNNER_TEMP/tide-run.env"
          printf '%s\n' 'SYNC_DOMAIN=direct.example.com' 'SYNC_ADMIN_USERNAME=run-admin' \
            'SYNC_ADMIN_PASSWORD=direct-qa-password-2026' > "$file"
          docker run -d --name tide-run-ci --env-file "$file" \
            -p 127.0.0.1:8473:8472 tidelisten-sync:local
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 \
            http://127.0.0.1:8473/health || { docker logs tide-run-ci; exit 1; }
          curl -fsS http://127.0.0.1:8473/admin/api/login \
            -H 'Origin: https://direct.example.com' -H 'Content-Type: application/json' \
            --data '{"name":"run-admin","password":"direct-qa-password-2026"}' | jq -e '.account == "run-admin"'
      - run: docker run --rm --user node --volume "${PWD}:/suite:ro" --entrypoint node "$(docker compose images -q sync)" /suite/test.mjs
      - name: Test upgrade with root-owned bind mounts
        run: bash tests/container-upgrade.sh
      - name: Save verified image
        env:
          TIDE_ARCH: ${{ matrix.arch }}
        run: |
          docker save tidelisten-sync:local | gzip -1 > "/tmp/TideListen-Sync-linux-$TIDE_ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: sync-linux-${{ matrix.arch }}
          path: /tmp/TideListen-Sync-linux-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 7
      - if: always()
        run: |
          docker rm -f tide-run-ci || true
          docker compose down -v

  publish-docker-hub:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-24.04
    concurrency:
      group: tide-listen-server-docker-hub
      cancel-in-progress: false
    env:
      IMAGE: docker.io/zjuzsj/tide-listen-server
      VERSION: 0.13.5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sync-linux-*
          path: image-archives
      - name: Sign in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Add the DOCKERHUB_TOKEN Actions secret before publishing.'
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username zjuzsj --password-stdin
      - name: Push the tested image for each architecture
        run: |
          for arch in amd64 arm64; do
            docker load -i "image-archives/sync-linux-$arch/TideListen-Sync-linux-$arch.tar.gz"
            test "$(docker image inspect tidelisten-sync:local --format '{{.Architecture}}')" = "$arch"
            target="$IMAGE:$VERSION-$arch"
            docker tag tidelisten-sync:local "$target"
            docker push "$target"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
      - if: always()
        run: docker logout
      - name: Verify anonymous pulls
        run: |
          for tag in "$VERSION" latest; do
            docker buildx imagetools inspect --raw "$IMAGE:$tag" | \
              jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          done

  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_image
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build both Android release variants
        working-directory: packages/android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          bash gradlew --no-daemon assemblePhoneRelease assembleDashboardRelease
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash sync-server/tests/android/run.sh
